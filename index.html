<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16090d">
<title>MM ROLEPLAY ONLINE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16090d;color:#fff;font-family:Tahoma,Arial,sans-serif}
.screen{position:relative;width:100%;height:100%;min-height:420px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#32213d 0%,#bd6670 45%,#3b171b 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 18% 42%,#ffb07888,transparent 38%),linear-gradient(180deg,transparent 42%,#180b12 100%)}
.city{position:absolute;inset:23% 0 16%;display:flex;align-items:flex-end;justify-content:space-around;opacity:.95}
.tower{position:relative;width:13%;height:62%;background:linear-gradient(90deg,#30212a,#70505a 45%,#24151d);border:2px solid #9e6b57;box-shadow:inset 0 0 0 8px #0002}
.tower:before{content:"";position:absolute;inset:12% 12%;background:repeating-linear-gradient(90deg,#f5b45a 0 5px,transparent 5px 18px),repeating-linear-gradient(0deg,transparent 0 18px,#190f18 18px 23px)}
.tower.big{height:88%;width:23%;border-top:18px solid #9d2730}
.star{position:absolute;top:-42px;left:50%;transform:translateX(-50%);color:#ffcf5c;font-size:42px;text-shadow:0 0 18px #ffb000}
.flag{position:absolute;top:25%;left:50%;width:42%;height:28%;background:#c91424;box-shadow:0 0 12px #0008;display:grid;place-items:center;color:#ffcf55;font-size:clamp(25px,5vw,65px)}
.statue{position:absolute;bottom:16%;left:29%;width:9%;height:31%;background:linear-gradient(90deg,#17191c,#494348,#17191c);clip-path:polygon(38% 0,62% 0,70% 18%,83% 28%,75% 43%,100% 100%,0 100%,25% 43%,17% 28%,30% 18%)}
.plaza{position:absolute;bottom:0;left:0;right:0;height:23%;background:repeating-linear-gradient(0deg,#241820 0 2px,#49313a 2px 4px),repeating-linear-gradient(90deg,transparent 0 8%,#120b10 8% 8.3%);transform:perspective(260px) rotateX(20deg);transform-origin:bottom}
.car{position:absolute;bottom:18%;right:8%;width:18%;height:8%;border-radius:45% 35% 12% 12%;background:#d7192b;box-shadow:inset 0 8px #ff5360,0 10px 14px #0009}
.car:before,.car:after{content:"";position:absolute;bottom:-9px;width:24px;height:24px;border-radius:50%;background:#101014;border:5px solid #777}
.car:before{left:15%}.car:after{right:15%}
.heli{position:absolute;top:17%;right:16%;font-size:clamp(36px,6vw,76px);filter:drop-shadow(0 5px 4px #0008);transform:rotate(-8deg)}
.heli:after{content:"";position:absolute;top:12%;left:-35%;width:170%;height:3px;background:#171116;transform:rotate(-8deg)}
.logo{position:absolute;top:5%;left:4%;z-index:3;font-weight:1000;line-height:.9;text-align:left;transform:skew(-5deg);text-shadow:4px 5px 0 #17080b,0 0 22px #ff2435}
.logo .mm{font-size:clamp(42px,8vw,100px);color:#f21b2c;letter-spacing:-5px}.logo .role{font-size:clamp(24px,4.5vw,55px);color:#fff}.logo .online{display:inline-block;background:#c90d20;padding:7px 20px;margin-top:8px;font-size:clamp(16px,2.4vw,29px);letter-spacing:4px}
.motto{position:absolute;top:7%;right:5%;text-align:right;font-size:clamp(15px,2vw,25px);font-weight:900;text-shadow:0 2px 5px #000}
.motto small{display:block;margin-top:10px;font-size:.62em;color:#ffe0b2}
.footer{position:relative;z-index:4;width:min(94%,1200px);padding:0 0 3.5vh;text-align:center}
.status{font-size:clamp(18px,2.3vw,28px);font-weight:900;text-shadow:0 3px 8px #000;margin-bottom:12px}
.bar{height:24px;border:2px solid #e5b5a0;border-radius:30px;background:#130d12dd;padding:3px;overflow:hidden;box-shadow:0 0 15px #000}
.fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,#9c0718,#ff3038,#ff9a54);animation:load 12s ease-out forwards}
@keyframes load{to{width:100%}}
.features{display:flex;justify-content:space-between;gap:10px;margin-top:17px;flex-wrap:wrap}
.feature{background:#170c12dd;border:1px solid #ed2835;border-radius:13px;padding:10px 15px;font-size:clamp(12px,1.5vw,17px);font-weight:bold;box-shadow:0 4px 12px #0008}
.brand{margin-top:16px;color:#ff2738;font-weight:900;letter-spacing:1px}
@media(max-width:600px){.motto{top:4%;right:4%;font-size:13px}.logo{top:5%;left:3%}.tower{width:17%}.tower.big{width:30%}.statue{left:22%}.features{justify-content:center}.feature{padding:7px 9px}.footer{padding-bottom:4vh}.heli{right:8%;top:23%}}
</style>
</head>
<body>
<main class="screen">
<div class="sky"></div>
<div class="city">
<div class="tower" style="height:48%"></div><div class="tower" style="height:66%"></div>
<div class="tower big"><div class="star">★</div><div class="flag">☭</div></div>
<div class="tower" style="height:58%"></div><div class="tower" style="height:73%"></div>
</div>
<div class="statue"></div><div class="heli">🚁</div><div class="car"></div><div class="plaza"></div>
<div class="logo"><div class="mm">MM ★</div><div class="role">ROLEPLAY</div><div class="online">ONLINE</div></div>
<div class="motto">با هم، برای یک اتحاد بزرگ!<small>اتحادیه MM؛ قدرت در اتحاد است.</small></div>
<section class="footer">
<div class="status">در حال بارگذاری بازی...</div>
<div class="bar"><div class="fill"></div></div>
<div class="features"><div class="feature">۱۵ بازیکن آنلاین</div><div class="feature">دنیای آزاد و بزرگ</div><div class="feature">نقش‌آفرینی و پیشرفت</div><div class="feature">ماموریت‌های متنوع</div></div>
<div class="brand">MM ROLEPLAY　|　اتحادیه MM</div>
</section>
</main>
</body>
</html>
